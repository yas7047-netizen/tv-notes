<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تذكيرات</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="تذكيرات">
<meta name="theme-color" content="#15191e">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --bg: #15191e; --card: #1e242b; --line: #2c343d; --text: #eef0f2; --dim: #9aa4ae; --accent: #ffe36e;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, "SF Arabic", "Segoe UI", Tahoma, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    max-width: 560px; margin: 0 auto;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; margin: 4px 2px 16px; }
  h1 { font-size: 28px; margin: 0; }
  #status { font-size: 13px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
  #status i { width: 8px; height: 8px; border-radius: 50%; background: #666; display: inline-block; }
  #status.ok i { background: #6fd28a; }
  h2 { font-size: 15px; color: var(--dim); font-weight: 600; margin: 22px 2px 10px; }

  /* The note being written is itself a sticker. */
  .paper {
    background-image: url(paper.png); background-blend-mode: normal;
    position: relative; border-radius: 6px; color: #2a2622;
  }
  .paper::before {
    content: ""; position: absolute; top: -10px; left: 50%; width: 32%; height: 22px;
    transform: translateX(-50%) rotate(-3deg); background: rgba(244,238,220,.7);
  }
  /* Heart magnets instead of the tape (m: 1 red, 2 pink), like a note on the fridge. */
  .paper.m1::before, .paper.m2::before, .mini.m1::before, .mini.m2::before {
    width: 42px; height: 42px; top: -19px; transform: translateX(-50%);
    background: center / contain no-repeat;
  }
  .paper.m1::before, .mini.m1::before { background-image: url(heart_red.png); }
  .paper.m2::before, .mini.m2::before { background-image: url(heart_pink.png); }
  .item.m1::before, .item.m2::before { width: 30px; height: 30px; top: -14px; }
  .mini { overflow: visible; }
  .mini.m1::before, .mini.m2::before { content: ""; position: absolute; left: 50%; width: 17%; height: auto; aspect-ratio: 1; top: -7%; max-width: 4.6cqw; }
  .mini > span { overflow: hidden; max-height: 100%; }
  #note { padding: 26px 18px 16px; margin-top: 8px; transition: background .2s, transform .2s; }
  /* Each size has its own pose like on the TV (Overlay.POSES): a tilt and a corner bent up off the screen. */
  .paper::after, .mini::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
    background: linear-gradient(var(--bend), transparent 0 64%, rgba(0,0,0,.18) 70%, rgba(255,255,255,0) 73%,
      rgba(255,255,255,.4) 86%, rgba(255,255,255,.22));
  }
  .s0 { --bend: 135deg; rotate: 2deg; }
  .s1 { --bend: 225deg; rotate: -2deg; }
  .s2 { --bend: 45deg; rotate: 1.2deg; }
  .s3 { --bend: 225deg; rotate: -1deg; }
  #text {
    width: 100%; min-height: 120px; border: 0; background: transparent; resize: none; outline: none;
    font: 700 22px/1.45 inherit; font-family: inherit; color: inherit; text-align: center;
  }
  #text::placeholder { color: rgba(42,38,34,.45); }
  #count { position: absolute; bottom: 6px; left: 10px; font-size: 11px; color: rgba(42,38,34,.5); }

  .colors { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
  .colors button {
    width: 36px; height: 36px; border-radius: 50%; border: 3px solid transparent; cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,.4);
  }
  .colors button.on { border-color: #fff; transform: scale(1.12); }

  /* Mini TV: the real layout at 1920×1080, shrunk. Drag a note to move it, tap one to edit it. */
  .tv {
    container-type: inline-size; position: relative; aspect-ratio: 16 / 9; border-radius: 10px;
    background: linear-gradient(160deg, #3b4652, #1b2027); border: 6px solid #0b0d10; overflow: hidden;
  }
  /* Outside the area is off limits for the notes (the clock, the verses, the apps): shaded. */
  .area {
    position: absolute; overflow: hidden; box-shadow: 0 0 0 100cqw rgba(0,0,0,.55);
    outline: 1px solid rgba(255,255,255,.25); touch-action: none; cursor: crosshair;
  }
  .layer, .zones { position: absolute; inset: 0; }
  .zones { pointer-events: none; }
  /* A sketch of the TV's own things (sent by the TV): off limits outside the area, coverable inside it. */
  .zone {
    position: absolute; display: flex; align-items: center; justify-content: center; text-align: center;
    border-radius: .8cqw; font-size: 1.9cqw; line-height: 1.2; padding: .4cqw;
  }
  .zone.off { background: rgba(255,95,95,.16); border: 1px dashed rgba(255,130,130,.7); color: #ffc0c0; }
  .zone.in { border: 1px dashed rgba(255,255,255,.35); color: rgba(255,255,255,.55); }
  .hint { font-size: 12px; color: var(--dim); margin: -4px 2px 10px; }
  .mini {
    position: absolute; cursor: grab;
    border-radius: .4cqw; color: #2a2622; font-weight: 700; display: flex; align-items: center; justify-content: center;
    text-align: center; overflow: hidden; padding: 1cqw; line-height: 1.15;
    word-break: break-word;
  }
  .mini.new { outline: .4cqw dashed rgba(255,255,255,.95); outline-offset: .3cqw; z-index: 2; }
  #cancel { display: block; margin: 10px auto 0; }

  .sizes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  #magnets { grid-template-columns: repeat(3, 1fr); }
  .sizes button, .ghost {
    background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 12px;
    padding: 11px 4px; font: inherit; font-size: 15px; cursor: pointer;
  }
  .sizes button.on { background: var(--accent); color: #2a2622; border-color: var(--accent); font-weight: 700; }

  #send {
    width: 100%; margin-top: 24px; padding: 16px; border: 0; border-radius: 14px; background: var(--accent);
    color: #2a2622; font: inherit; font-size: 19px; font-weight: 800; cursor: pointer;
  }
  #send:disabled { opacity: .5; }
  #msg { text-align: center; min-height: 22px; margin-top: 10px; color: var(--dim); font-size: 14px; }
  #msg.ok { color: #6fd28a; }
  #msg.err { color: #ff8a80; }

  #list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px 12px; }
  .item { padding: 22px 10px 10px; min-height: 96px; font-weight: 700; font-size: 15px; text-align: center; cursor: pointer; }
  .item small { display: block; font-weight: 400; font-size: 11px; color: rgba(42,38,34,.6); margin-top: 6px; }
  .item .x {
    position: absolute; top: -8px; left: -8px; width: 28px; height: 28px; border-radius: 50%; border: 0;
    background: #2a2622; color: #fff; font-size: 15px; cursor: pointer; z-index: 1;
  }
  .empty { color: var(--dim); font-size: 14px; text-align: center; grid-column: 1 / -1; padding: 10px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; }
  .ghost { padding: 6px 12px; font-size: 13px; }
  /* Tabs: the family chat, and the notes pinned on a screen. */
  #tabs { display: flex; gap: 8px; margin: 0 0 14px; }
  #tabs button { flex: 1; padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--card);
    color: var(--text); font: inherit; font-size: 15px; cursor: pointer; }
  #tabs button.on { background: var(--accent); color: #2a2622; border-color: var(--accent); font-weight: 700; }
  #who { font-size: 13px; color: var(--dim); background: none; border: 0; cursor: pointer; padding: 0; font: inherit; }
  #screens { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  #screens button.on { background: var(--accent); color: #2a2622; border-color: var(--accent); font-weight: 700; }

  /* Chat */
  #chatView { display: flex; flex-direction: column; min-height: calc(100dvh - 130px); }
  #thread { flex: 1; padding-bottom: 90px; }
  #older { display: block; margin: 0 auto 10px; }
  #offline { text-align: center; color: var(--dim); font-size: 13px; margin: 6px 0 12px; }
  .daysep { text-align: center; color: var(--dim); font-size: 12px; margin: 16px 0 8px; }
  .bub { position: relative; max-width: 82%; margin: 6px 0; padding: 8px 12px 6px; border-radius: 16px;
    background: var(--card); border-top-right-radius: 4px; }
  .bub.mine { margin-right: auto; background: #2f4a3a; border-top-right-radius: 16px; border-top-left-radius: 4px; }
  .bub .name { font-size: 12px; font-weight: 700; margin-bottom: 2px; }
  .bub .body { font-size: 16px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .bub .body a { color: #8cc8ff; }
  .bub .meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 3px;
    font-size: 11px; color: var(--dim); }
  .bub .pin { border: 0; background: none; color: var(--dim); font-size: 13px; cursor: pointer; padding: 0; }
  .bub img, .bub video { display: block; max-width: 100%; max-height: 320px; border-radius: 10px; margin: 4px 0; }
  .bub .note { font-size: 12px; color: var(--dim); }
  .bub .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin: 6px 0 2px; }
  .bub .bar i { display: block; height: 100%; width: 0; background: var(--accent); }
  #composer { position: fixed; bottom: 0; left: 0; right: 0; display: flex; gap: 8px; align-items: flex-end;
    padding: 10px max(12px, calc(50vw - 268px)) max(12px, env(safe-area-inset-bottom)); background: #10141a;
    border-top: 1px solid var(--line); }
  #composer textarea { flex: 1; resize: none; max-height: 120px; padding: 10px 14px; border-radius: 20px;
    border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; font-size: 16px; }
  #composer button { width: 44px; height: 44px; border-radius: 50%; border: 0; font-size: 20px; cursor: pointer;
    background: var(--card); color: var(--text); flex: none; }
  #composer #csend { background: var(--accent); color: #2a2622; }
  #viewer { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: none; align-items: center;
    justify-content: center; z-index: 10; }
  #viewer img { max-width: 100%; max-height: 100%; }

  /* Asking the name the first time. */
  #ask { position: fixed; inset: 0; background: rgba(10,12,15,.96); display: none; align-items: center;
    justify-content: center; z-index: 20; padding: 24px; }
  #ask form { width: 100%; max-width: 360px; text-align: center; }
  #ask h3 { font-size: 24px; margin: 0 0 6px; }
  #ask p { color: var(--dim); margin: 0 0 18px; }
  #ask input { width: 100%; padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--card);
    color: var(--text); font: inherit; font-size: 20px; text-align: center; }
  #ask button { width: 100%; margin-top: 12px; padding: 14px; border-radius: 14px; border: 0; background: var(--accent);
    color: #2a2622; font: inherit; font-size: 18px; font-weight: 800; }

  #nochannel { display: none; text-align: center; color: var(--dim); margin-top: 30vh; line-height: 1.8; }
</style>
</head>
<body>
<div id="nochannel">هذا الرابط ناقص.<br>افتح الرابط الخاص بشاشتك.</div>
<main id="app">
  <header>
    <h1>تذكيرات</h1>
    <span id="status"><i></i><span>جاري الاتصال…</span></span>
  </header>
  <div id="tabs" hidden>
    <button data-tab="chat">💬 المحادثة</button>
    <button data-tab="pin">📌 على الشاشة</button>
  </div>

  <section id="chatView" hidden>
    <div id="thread">
      <button class="ghost" id="older" hidden>عرض الأقدم</button>
      <div id="offline" hidden></div>
      <div id="msgs"></div>
    </div>
    <div id="composer">
      <button id="attach" aria-label="صورة أو فيديو">📎</button>
      <textarea id="ctext" rows="1" dir="auto" placeholder="اكتب رسالة…"></textarea>
      <button id="csend" aria-label="أرسل">➤</button>
      <input type="file" id="file" accept="image/*,video/*" multiple hidden>
    </div>
  </section>

  <section id="pinView">
  <div id="screens"></div>
  <div id="note" class="paper">
    <textarea id="text" rows="4" maxlength="240" placeholder="اكتب الملاحظة هنا…" dir="auto"></textarea>
    <span id="count"></span>
  </div>
  <div class="colors" id="colors"></div>

  <h2>المكان في الشاشة</h2>
  <p class="hint">اسحب الورقة لمكانها، أو اضغط أي مكان. واضغط على أي ورقة لتعدّلها. الأحمر ممنوع.</p>
  <div class="tv">
    <div class="area" id="area">
      <div class="zones" id="zonesIn"></div>
      <div class="layer" id="layer"></div>
    </div>
    <div class="zones" id="zonesOut"></div>
  </div>

  <h2>الحجم</h2>
  <div class="sizes" id="sizes"></div>

  <h2>التثبيت</h2>
  <div class="sizes" id="magnets"></div>

  <button id="send">أرسل للشاشة</button>
  <button class="ghost" id="cancel" hidden>إلغاء التعديل، ملاحظة جديدة</button>
  <div id="msg"></div>

  <div class="row">
    <h2>على الشاشة الآن</h2>
    <button class="ghost" id="clear" hidden>امسح الكل</button>
  </div>
  <div id="list"></div>
  </section>
  <p style="text-align:center;margin-top:28px"><button id="who" hidden></button></p>
</main>
<div id="viewer"></div>
<div id="ask"><form>
  <h3>هلا 👋</h3>
  <p>وش اسمك؟ يطلع مع رسائلك في المحادثة.</p>
  <input id="askname" maxlength="20" autocomplete="name" dir="auto">
  <button>دخول</button>
</form></div>

<script>
const NTFY = 'https://ntfy.sh/';
const COLORS = ['#FFE36E', '#FFB3C7', '#B8F0A8', '#A8D8FF', '#FFC48A', '#D6C4FF', '#FDFCF7'];
const SIZE_NAMES = ['صغير', 'متوسط', 'كبير', 'كبير جداً'];
const MAGNET_NAMES = ['شريط لاصق', 'قلب أحمر ❤️', 'قلب وردي 🩷'];
// Same as the TV (Overlay.java): width, height, largest text, at 1920 pixels wide.
const SIZES = [[320, 250, 46], [470, 350, 62], [700, 500, 86], [1180, 740, 130]];
// Notes sit at x, y: their top left corner inside the area, at 1920×1080. Older notes have a place (p) instead,
// the same as Overlay.PLACES on the TV.
const M = 56;
const HEART_ROOM = 50;   // the tape or heart hangs over the top edge
// Lengths are written in TV pixels (1920 wide) and turned into widths of the mini TV.
const cq = css => css.replace(/(-?\d+(\.\d+)?)px/g, (_, n) => `${n / 19.2}cqw`);

// The link is either the family's (#fam-…: the chat, and notes on any of its screens) or one screen's (#tv-…).
// Opened from the phone's home screen the link may come without its #…: use the one saved last time.
const linkHash = location.hash.slice(1).replace(/[^\w-]/g, '') || load('link');
if (linkHash) save('link', linkHash);
const group = linkHash.startsWith('fam-') ? linkHash : null;
let channel = group ? load('screen') : linkHash;
const $ = id => document.getElementById(id);
const form = { id: null, c: COLORS[0], s: 1, m: 0, x: null, y: null };
let notes = [];
let area = [0, 0, 1920, 1080];
let zones = [];
let waitingFor = null;
let drag = null;


function load(k) {
  try { return localStorage.getItem('notes.' + k) || ''; } catch (_) { return ''; }
}

function save(k, v) {
  try { localStorage.setItem('notes.' + k, v); } catch (_) {}
}

function start() {
  COLORS.forEach(c => {
    const b = document.createElement('button');
    b.style.background = c;
    b.setAttribute('aria-label', 'لون');
    b.onclick = () => { form.c = c; draw(); };
    $('colors').append(b);
  });
  $('area').onpointerdown = press;
  $('area').onpointermove = move;
  $('area').onpointerup = $('area').onpointercancel = () => { drag = null; };
  $('cancel').onclick = reset;
  SIZE_NAMES.forEach((name, s) => {
    const b = document.createElement('button');
    b.textContent = name;
    b.onclick = () => { form.s = s; draw(); };
    $('sizes').append(b);
  });
  MAGNET_NAMES.forEach((name, m) => {
    const b = document.createElement('button');
    b.textContent = name;
    b.onclick = () => { form.m = m; draw(); };
    $('magnets').append(b);
  });
  $('text').oninput = $('text').onfocus = $('text').onblur = draw;
  $('send').onclick = send;
  $('text').oninput = () => { if (form.x == null) place(); draw(); };
  $('clear').onclick = () => {
    if (confirm('تمسح كل الملاحظات من الشاشة؟')) publish({ op: 'clear' }, 'انمسحت كل الملاحظات');
  };
  draw();
  if (channel) follow();
}

// The TV publishes the full list of notes to "<channel>-s" whenever it changes, and every few hours.
let stateSource = null;
function follow() {
  if (stateSource) stateSource.close();
  notes = [];
  const es = stateSource = new EventSource(NTFY + channel + '-s/sse?since=all');
  es.onmessage = async e => {
    try {
      const m = JSON.parse(e.data);
      const state = JSON.parse(await body(m));
      notes = state.n || [];
      area = state.a || [0, 0, 1920, 1080];
      zones = state.z || [];
      setStatus(true);
      if (waitingFor && waitingFor(notes)) {
        waitingFor = null;
        say('وصلت للشاشة ✓', 'ok');
      }
      draw();
    } catch (_) {}
  };
  es.onerror = () => setStatus(false);
}

// A long message reaches ntfy as an attached file.
async function body(m) {
  const a = m.attachment;
  if (a && a.name === 'attachment.json') return (await fetch(a.url)).text();
  return m.message;
}

function setStatus(ok) {
  $('status').className = ok ? 'ok' : '';
  $('status').lastElementChild.textContent = ok ? 'متصل' : 'غير متصل';
}

function draw() {
  $('note').style.backgroundColor = form.c;
  $('note').className = 'paper m' + form.m + ' s' + form.s;
  [...$('magnets').children].forEach((b, i) => b.classList.toggle('on', i === form.m));
  const len = $('text').value.length;
  $('count').textContent = len > 180 ? `${len} / 240` : '';
  [...$('colors').children].forEach((b, i) => b.classList.toggle('on', COLORS[i] === form.c));
  const [l, t, r, b] = area;
  $('area').style.cssText = cq(`left:${l}px;top:${t}px;width:${r - l}px;height:${b - t}px`);
  $('zonesIn').innerHTML = $('zonesOut').innerHTML = '';
  zones.forEach(([x0, y0, x1, y1, label, inside]) => {
    const z = document.createElement('div');
    z.className = 'zone ' + (inside ? 'in' : 'off');
    const dx = inside ? l : 0, dy = inside ? t : 0;
    z.style.cssText = cq(`left:${x0 - dx}px;top:${y0 - dy}px;width:${x1 - x0}px;height:${y1 - y0}px`);
    z.textContent = label;
    $(inside ? 'zonesIn' : 'zonesOut').append(z);
  });
  [...$('sizes').children].forEach((b, i) => b.classList.toggle('on', i === form.s));
  $('send').textContent = form.id ? 'حدّث الملاحظة' : 'أرسل للشاشة';
  $('cancel').hidden = !form.id;

  // Mini TV: the notes on the screen, with the one being written or edited where it will go.
  const layer = $('layer');
  layer.innerHTML = '';
  const shown = notes.filter(n => n.id !== form.id);
  if (form.x != null) shown.push({ id: '_new', t: $('text').value.trim() || '…', c: form.c, s: form.s, m: form.m, x: form.x, y: form.y });
  shown.forEach(n => {
    const { x, y } = pos(n);
    const [w, h, f] = dims(n.s);
    const el = document.createElement('div');
    el.className = 'mini m' + (n.m || 0) + ' s' + n.s + (n.id === '_new' ? ' new' : '');
    el.dataset.id = n.id;
    el.style.cssText = `background-color:${n.c}cc;left:${x / 19.2}cqw;top:${y / 19.2}cqw;` +
      `width:${w / 19.2}cqw;height:${h / 19.2}cqw;font-size:${f / 19.2 * 0.7}cqw`;
    const span = document.createElement('span');
    span.textContent = n.t;
    el.append(span);
    layer.append(el);
  });

  const list = $('list');
  list.innerHTML = '';
  $('clear').hidden = notes.length < 2;
  if (!notes.length) {
    list.innerHTML = '<div class="empty">ما فيه ملاحظات على الشاشة</div>';
  }
  notes.forEach(n => {
    const el = document.createElement('div');
    el.className = 'paper item m' + (n.m || 0) + ' s' + n.s;
    el.style.backgroundColor = n.c;
    el.textContent = n.t;
    const small = document.createElement('small');
    small.textContent = SIZE_NAMES[n.s];
    el.append(small);
    const x = document.createElement('button');
    x.className = 'x';
    x.textContent = '✕';
    x.setAttribute('aria-label', 'احذف');
    x.onclick = e => {
      e.stopPropagation();
      publish({ op: 'del', id: n.id }, 'انحذفت', ns => !ns.some(m => m.id === n.id));
    };
    el.append(x);
    el.onclick = () => edit(n);
    list.append(el);
  });
}

function edit(n, stay) {
  Object.assign(form, { id: n.id, c: n.c, s: n.s, m: n.m || 0 }, pos(n));
  $('text').value = n.t;
  say('تعدّل ملاحظة موجودة: غيّر اللي تبي واضغط «حدّث الملاحظة»');
  draw();
  if (!stay) window.scrollTo({ top: 0, behavior: 'smooth' });
}

function reset() {
  Object.assign(form, { id: null, x: null, y: null });
  $('text').value = '';
  say('');
  draw();
}

function dims(s) {
  const [w, h, f] = SIZES[s] || SIZES[1];
  return [Math.min(w, area[2] - area[0] - 2 * M), h, f];
}

// Where a note is in the area, kept inside it with room for the tape or heart above.
function pos(n) {
  const [w, h] = dims(n.s);
  const aw = area[2] - area[0], ah = area[3] - area[1];
  let x = n.x, y = n.y;
  if (x == null) {
    x = [M, (aw - w) / 2, aw - M - w, aw - M - w, M][n.p] ?? M;
    y = [M, M, M, ah - 170 - h, ah - M - h][n.p] ?? M;
  }
  return {
    x: Math.round(Math.max(8, Math.min(aw - w - 8, x))),
    y: Math.round(Math.max(HEART_ROOM, Math.min(ah - h - 8, y))),
  };
}

// A new note starts in the middle of the area.
function place() {
  const [w, h] = dims(form.s);
  Object.assign(form, pos({ s: form.s, x: (area[2] - area[0] - w) / 2, y: (area[3] - area[1] - h) / 2 }));
}

// Mini TV: tap a note to edit it, drag the note being written or edited, tap an empty spot to move it there.
function press(e) {
  const r = $('area').getBoundingClientRect();
  const k = (area[2] - area[0]) / r.width;   // TV pixels per page pixel
  const hit = e.target.closest('.mini');
  const id = hit && hit.dataset.id;
  if (id && id !== '_new') {
    const n = notes.find(m => m.id === id);
    if (n) edit(n, true);
  } else if (!id) {
    const [w, h] = dims(form.s);
    Object.assign(form, pos({ s: form.s, x: (e.clientX - r.left) * k - w / 2, y: (e.clientY - r.top) * k - h / 2 }));
    draw();
  }
  drag = { k, x0: e.clientX, y0: e.clientY, fx: form.x, fy: form.y };
  $('area').setPointerCapture(e.pointerId);
}

function move(e) {
  if (!drag) return;
  Object.assign(form, pos({ s: form.s, x: drag.fx + (e.clientX - drag.x0) * drag.k, y: drag.fy + (e.clientY - drag.y0) * drag.k }));
  draw();
}

function send() {
  const t = $('text').value.trim();
  if (!t) { say('اكتب الملاحظة أول', 'err'); return; }
  const id = form.id || Math.random().toString(36).slice(2, 10);
  if (form.x == null) place();
  const { x, y } = pos(form);
  publish({ op: 'add', id, t, c: form.c, s: form.s, m: form.m, x, y }, null,
    ns => ns.some(m => m.id === id && m.t === t && m.x === x && m.y === y))
    .then(ok => { if (ok) reset(); });
}

async function publish(cmd, done, arrived) {
  if (!channel) { say('اختر الشاشة أول', 'err'); return false; }
  $('send').disabled = true;
  say('يرسل…');
  try {
    const r = await fetch(NTFY + channel, { method: 'POST', body: JSON.stringify(cmd) });
    if (!r.ok) throw new Error(r.status);
    say(done || 'انرسلت، ننتظر الشاشة…');
    waitingFor = arrived || (() => true);
    setTimeout(() => {
      if (waitingFor) { waitingFor = null; say('انرسلت، وتظهر لما تتصل الشاشة بالنت'); }
    }, 15000);
    return true;
  } catch (e) {
    say('ما انرسلت، تأكد من النت وحاول مرة ثانية', 'err');
    return false;
  } finally {
    $('send').disabled = false;
  }
}

function say(s, cls) {
  $('msg').textContent = s;
  $('msg').className = cls || '';
}

function hash(s) {
  let h = 0;
  for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) | 0;
  return Math.abs(h);
}

// ---- The family chat ------------------------------------------------------------------------------------------
// Messages go to the family channel, where every TV keeps them; when the page opens it asks the TVs for the
// conversation ({"op":"hist"}, answered on "<group>-h"), since ntfy itself forgets after 12 hours.

const NAME_COLORS = ['#ffd166', '#ff8fab', '#8ce99a', '#74c0fc', '#ffa94d', '#b197fc'];
const chatMsgs = new Map();
const pending = new Set();
let me = load('name');
let screens = {};
let more = false;

function chat() {
  $('tabs').hidden = false;
  $('who').hidden = false;
  [...$('tabs').children].forEach(b => { b.onclick = () => tab(b.dataset.tab); });
  tab(load('tab') || 'chat');
  $('who').onclick = askName;
  if (!me) askName(); else showWho();
  $('csend').onclick = sendText;
  $('ctext').oninput = () => { $('ctext').style.height = 'auto'; $('ctext').style.height = $('ctext').scrollHeight + 'px'; };
  $('attach').onclick = () => $('file').click();
  $('file').onchange = () => { [...$('file').files].forEach(sendFile); $('file').value = ''; };
  $('older').onclick = () => askHistory(oldest());
  $('viewer').onclick = () => { $('viewer').style.display = 'none'; };

  const live = new EventSource(NTFY + group + '/sse?since=all');
  live.onopen = () => setStatus(true);
  live.onerror = () => setStatus(false);
  live.onmessage = async e => {
    try {
      const m = JSON.parse(e.data);
      const cmd = JSON.parse(await body(m));
      if (cmd.op === 'msg') {
        if (!cmd.time) cmd.time = m.time * 1000;
        keep(cmd);
      } else if (cmd.op === 'hello' && cmd.name) {
        screens[cmd.name] = cmd.ch;
        drawScreens();
      }
    } catch (_) {}
  };
  const answers = new EventSource(NTFY + group + '-h/sse?since=1m');
  answers.onmessage = async e => {
    try {
      const r = JSON.parse(await body(JSON.parse(e.data)));
      if (!pending.has(r.req)) return;
      pending.delete(r.req);
      $('offline').hidden = true;
      more = r.more;
      Object.assign(screens, r.screens || {});
      drawScreens();
      (r.items || []).forEach(keep);
      drawChat();
    } catch (_) {}
  };
  answers.onopen = () => askHistory('');
}

function tab(t) {
  save('tab', t);
  [...$('tabs').children].forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  $('chatView').hidden = t !== 'chat';
  $('pinView').hidden = t !== 'pin';
  $('composer').style.display = t === 'chat' ? 'flex' : 'none';
  if (t === 'chat') window.scrollTo(0, document.body.scrollHeight);
}

function askName() {
  $('ask').style.display = 'flex';
  $('askname').value = me;
  $('askname').focus();
  $('ask').querySelector('form').onsubmit = e => {
    e.preventDefault();
    const n = $('askname').value.trim();
    if (!n) return;
    me = n;
    save('name', n);
    $('ask').style.display = 'none';
    showWho();
    drawChat();
  };
}

function showWho() { $('who').textContent = `أنت: ${me} · غيّر الاسم`; }

// Asks the TVs for a page of the conversation; the first TV to answer wins.
function askHistory(before) {
  const req = Math.random().toString(36).slice(2, 10);
  pending.add(req);
  fetch(NTFY + group, { method: 'POST', body: JSON.stringify({ op: 'hist', req, before }) }).catch(() => {});
  setTimeout(() => {
    if (!pending.has(req)) return;
    $('offline').hidden = false;
    $('offline').textContent = 'الشاشات مطفّية أو بدون نت، فالرسائل القديمة تظهر لما ترجع. والإرسال يشتغل عادي.';
  }, 9000);
}

function oldest() {
  let o = null;
  chatMsgs.forEach(m => { if (!m.local && (!o || m.time < o.time)) o = m; });
  return o ? o.id : '';
}

function keep(m) {
  const had = chatMsgs.get(m.id);
  // A fresh copy (with its ntfy link) beats one from a TV's history.
  if (had && had.u && !m.u) m.u = had.u;
  chatMsgs.set(m.id, Object.assign({}, m, { sent: true }));
  drawChat();
}

function drawScreens() {
  const names = Object.keys(screens);
  const box = $('screens');
  box.innerHTML = '';
  if (!names.length) {
    box.innerHTML = '<span class="hint">ننتظر الشاشات…</span>';
    return;
  }
  if (!channel || !Object.values(screens).includes(channel)) {
    channel = screens[names[0]];
    save('screen', channel);
    follow();
  }
  names.forEach(n => {
    const b = document.createElement('button');
    b.className = 'ghost' + (screens[n] === channel ? ' on' : '');
    b.textContent = '📺 ' + n;
    b.onclick = () => { channel = screens[n]; save('screen', channel); reset(); follow(); drawScreens(); };
    box.append(b);
  });
}

function drawChat() {
  const box = $('msgs');
  const atEnd = window.innerHeight + window.scrollY >= document.body.scrollHeight - 80;
  box.innerHTML = '';
  $('older').hidden = !more;
  let lastDay = '';
  [...chatMsgs.values()].sort((a, b) => a.time - b.time).forEach(m => {
    const d = dayName(m.time);
    if (d !== lastDay) {
      const s = document.createElement('div');
      s.className = 'daysep';
      s.textContent = lastDay = d;
      box.append(s);
    }
    const mine = m.from === me;
    const el = document.createElement('div');
    el.className = 'bub' + (mine ? ' mine' : '');
    if (!mine) {
      const n = document.createElement('div');
      n.className = 'name';
      n.textContent = m.from || '؟';
      n.style.color = nameColor(m.from || '');
      el.append(n);
    }
    if (m.k) el.append(media(m));
    if (m.progress != null) {
      const bar = document.createElement('div');
      bar.className = 'bar';
      bar.innerHTML = '<i></i>';
      bar.firstChild.style.width = Math.round(m.progress * 100) + '%';
      el.append(bar);
    }
    if (m.t) {
      const t = document.createElement('div');
      t.className = 'body';
      m.t.split(/(https?:\/\/\S+)/g).forEach((part, i) => {
        if (i % 2) {
          const a = document.createElement('a');
          a.href = part; a.target = '_blank'; a.rel = 'noopener'; a.textContent = part;
          t.append(a);
        } else t.append(part);
      });
      el.append(t);
    }
    const meta = document.createElement('div');
    meta.className = 'meta';
    const when = document.createElement('span');
    when.textContent = new Date(m.time).toLocaleTimeString('ar-SA', { hour: 'numeric', minute: '2-digit' }) +
      (mine ? (m.failed ? ' · ما انرسلت ⚠️' : m.sent ? ' ✓' : ' …') : '');
    meta.append(when);
    if (m.t) {
      const pin = document.createElement('button');
      pin.className = 'pin';
      pin.textContent = '📌 علّقها على الشاشة';
      pin.onclick = () => pinText(m.t);
      meta.append(pin);
    }
    el.append(meta);
    box.append(el);
  });
  if (!chatMsgs.size) box.innerHTML = '<div class="empty">ابدأ المحادثة 👋</div>';
  if (atEnd) window.scrollTo(0, document.body.scrollHeight);
}

function media(m) {
  const wrap = document.createElement('div');
  if (m.k === 'img') {
    const img = document.createElement('img');
    img.src = m.local || m.u || m.th || '';
    img.onclick = () => { $('viewer').innerHTML = ''; $('viewer').append(img.cloneNode()); $('viewer').style.display = 'flex'; };
    wrap.append(img);
  } else if (m.k === 'vid') {
    if (m.local || m.u) {
      const v = document.createElement('video');
      v.src = m.local || m.u;
      v.controls = true;
      v.preload = 'metadata';
      v.playsInline = true;
      if (m.th) v.poster = m.th;
      wrap.append(v);
    } else {
      if (m.th) { const img = document.createElement('img'); img.src = m.th; wrap.append(img); }
      wrap.insertAdjacentHTML('beforeend', '<div class="note">🎬 الفيديو محفوظ على الشاشة</div>');
    }
  }
  return wrap;
}

function pinText(t) {
  tab('pin');
  reset();
  $('text').value = t;
  place();
  draw();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

async function sendText() {
  const t = $('ctext').value.trim();
  if (!t) return;
  $('ctext').value = '';
  $('ctext').style.height = 'auto';
  const m = { op: 'msg', id: newId(), from: me, t, time: Date.now() };
  chatMsgs.set(m.id, Object.assign({}, m));
  drawChat();
  window.scrollTo(0, document.body.scrollHeight);
  await post(m);
}

async function post(m) {
  const out = Object.assign({}, m);
  ['local', 'progress', 'sent', 'failed'].forEach(k => delete out[k]);
  try {
    const r = await fetch(NTFY + group, { method: 'POST', body: JSON.stringify(out) });
    if (!r.ok) throw new Error(r.status);
  } catch (_) {
    const had = chatMsgs.get(m.id);
    if (had) { had.failed = true; drawChat(); }
  }
}

// Photos are made smaller on the phone first; a video goes as it is, up to ntfy's 15 MB.
async function sendFile(file) {
  const isVid = file.type.startsWith('video/');
  if (isVid && file.size > 15e6) {
    alert('الفيديو أكبر من 15 ميغا. صوّر مقطعاً أقصر، أو أرسل رابطه (يوتيوب مثلاً).');
    return;
  }
  const caption = $('ctext').value.trim();
  $('ctext').value = '';
  const m = { op: 'msg', id: newId(), from: me, time: Date.now(), k: isVid ? 'vid' : 'img', progress: 0 };
  if (caption) m.t = caption;
  m.local = URL.createObjectURL(file);
  chatMsgs.set(m.id, m);
  drawChat();
  window.scrollTo(0, document.body.scrollHeight);
  try {
    let blob = file, ext = (file.name.split('.').pop() || 'bin').toLowerCase();
    if (isVid) {
      m.th = await videoThumb(m.local);
    } else {
      const img = await loadImage(m.local);
      blob = await scaled(img, 1600, 0.82, 'blob');
      ext = 'jpg';
      m.th = await scaled(img, 220, 0.6, 'url');
    }
    m.u = await upload(blob, `${m.id}.${ext}`, p => { m.progress = p; drawChat(); });
    m.n = file.name;
    delete m.progress;
    drawChat();
    await post(m);
  } catch (_) {
    m.failed = true;
    delete m.progress;
    drawChat();
  }
}

function upload(blob, name, onProgress) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open('PUT', NTFY + group + '-f');
    x.setRequestHeader('Filename', name);
    x.upload.onprogress = e => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
    x.onload = () => {
      try { resolve(JSON.parse(x.responseText).attachment.url); } catch (e) { reject(e); }
    };
    x.onerror = reject;
    x.send(blob);
  });
}

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

function scaled(img, max, quality, as) {
  const k = Math.min(1, max / Math.max(img.naturalWidth || img.videoWidth, img.naturalHeight || img.videoHeight));
  const c = document.createElement('canvas');
  c.width = Math.round((img.naturalWidth || img.videoWidth) * k);
  c.height = Math.round((img.naturalHeight || img.videoHeight) * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  if (as === 'url') return Promise.resolve(c.toDataURL('image/jpeg', quality));
  return new Promise(r => c.toBlob(r, 'image/jpeg', quality));
}

function videoThumb(src) {
  return new Promise(resolve => {
    const v = document.createElement('video');
    v.muted = true;
    v.playsInline = true;
    v.preload = 'auto';
    v.src = src;
    v.onloadeddata = () => { v.currentTime = Math.min(0.5, (v.duration || 1) / 2); };
    v.onseeked = () => resolve(scaled(v, 220, 0.6, 'url'));
    v.onerror = () => resolve('');
    setTimeout(() => resolve(''), 6000);
  });
}

function nameColor(n) { return NAME_COLORS[hash(n) % NAME_COLORS.length]; }

function dayName(ms) {
  const d = new Date(ms), now = new Date();
  if (d.toDateString() === now.toDateString()) return 'اليوم';
  if (d.toDateString() === new Date(now - 864e5).toDateString()) return 'أمس';
  return d.toLocaleDateString('ar-SA-u-ca-gregory', { weekday: 'long', day: 'numeric', month: 'long' });
}

// Started last, once every variable above exists.
if (!linkHash) {
  $('app').hidden = true;
  $('nochannel').style.display = 'block';
} else {
  start();
  if (group) chat();
}
</script>
