<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تذكيرات</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="تذكيرات">
<meta name="theme-color" content="#15191e">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
  :root {
    --bg: #15191e; --card: #1e242b; --line: #2c343d; --text: #eef0f2; --dim: #9aa4ae; --accent: #ffe36e;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, "SF Arabic", "Segoe UI", Tahoma, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    max-width: 560px; margin: 0 auto;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; margin: 4px 2px 16px; }
  h1 { font-size: 28px; margin: 0; }
  #status { font-size: 13px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
  #status i { width: 8px; height: 8px; border-radius: 50%; background: #666; display: inline-block; }
  #status.ok i { background: #6fd28a; }
  h2 { font-size: 15px; color: var(--dim); font-weight: 600; margin: 22px 2px 10px; }

  /* The note being written is itself a sticker. */
  .paper {
    background-image: url(paper.png); background-blend-mode: normal;
    position: relative; border-radius: 6px; color: #2a2622;
    box-shadow: 0 10px 24px rgba(0,0,0,.45);
  }
  .paper::before {
    content: ""; position: absolute; top: -10px; left: 50%; width: 32%; height: 22px;
    transform: translateX(-50%) rotate(-3deg); background: rgba(244,238,220,.7);
  }
  /* Heart magnets instead of the tape (m: 1 red, 2 pink), like a note on the fridge. */
  .paper.m1::before, .paper.m2::before, .mini.m1::before, .mini.m2::before {
    width: 42px; height: 42px; top: -19px; transform: translateX(-50%);
    background: center / contain no-repeat;
  }
  .paper.m1::before, .mini.m1::before { background-image: url(heart_red.png); }
  .paper.m2::before, .mini.m2::before { background-image: url(heart_pink.png); }
  .item.m1::before, .item.m2::before { width: 30px; height: 30px; top: -14px; }
  .mini { overflow: visible; }
  .mini.m1::before, .mini.m2::before { content: ""; position: absolute; left: 50%; width: 17%; height: auto; aspect-ratio: 1; top: -7%; max-width: 4.6cqw; }
  .mini > span { overflow: hidden; max-height: 100%; }
  #note { padding: 26px 18px 16px; margin-top: 8px; transition: background .2s, transform .2s; }
  /* Each size has its own pose like on the TV (Overlay.POSES): a tilt and a corner bent up off the screen. */
  .paper::after, .mini::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
    background: linear-gradient(var(--bend), transparent 0 64%, rgba(0,0,0,.18) 70%, rgba(255,255,255,0) 73%,
      rgba(255,255,255,.4) 86%, rgba(255,255,255,.22));
  }
  .s0 { --bend: 135deg; rotate: 2deg; }
  .s1 { --bend: 225deg; rotate: -2deg; }
  .s2 { --bend: 45deg; rotate: 1.2deg; }
  .s3 { --bend: 225deg; rotate: -1deg; }
  #text {
    width: 100%; min-height: 120px; border: 0; background: transparent; resize: none; outline: none;
    font: 700 22px/1.45 inherit; font-family: inherit; color: inherit; text-align: center;
  }
  #text::placeholder { color: rgba(42,38,34,.45); }
  #count { position: absolute; bottom: 6px; left: 10px; font-size: 11px; color: rgba(42,38,34,.5); }

  .colors { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
  .colors button {
    width: 36px; height: 36px; border-radius: 50%; border: 3px solid transparent; cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,.4);
  }
  .colors button.on { border-color: #fff; transform: scale(1.12); }

  /* Mini TV: the real layout at 1920×1080, shrunk. Drag a note to move it, tap one to edit it. */
  .tv {
    container-type: inline-size; position: relative; aspect-ratio: 16 / 9; border-radius: 10px;
    background: linear-gradient(160deg, #3b4652, #1b2027); border: 6px solid #0b0d10; overflow: hidden;
  }
  /* Outside the area is off limits for the notes (the clock, the verses, the apps): shaded. */
  .area {
    position: absolute; overflow: hidden; box-shadow: 0 0 0 100cqw rgba(0,0,0,.55);
    outline: 1px solid rgba(255,255,255,.25); touch-action: none; cursor: crosshair;
  }
  .layer { position: absolute; inset: 0; }
  .hint { font-size: 12px; color: var(--dim); margin: -4px 2px 10px; }
  .mini {
    position: absolute; cursor: grab;
    border-radius: .4cqw; color: #2a2622; font-weight: 700; display: flex; align-items: center; justify-content: center;
    text-align: center; overflow: hidden; padding: 1cqw; line-height: 1.15; box-shadow: 0 .5cqw 1cqw rgba(0,0,0,.4);
    word-break: break-word;
  }
  .mini.new { outline: .4cqw dashed rgba(255,255,255,.95); outline-offset: .3cqw; z-index: 2; }
  #cancel { display: block; margin: 10px auto 0; }

  .sizes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  #magnets { grid-template-columns: repeat(3, 1fr); }
  .sizes button, .ghost {
    background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 12px;
    padding: 11px 4px; font: inherit; font-size: 15px; cursor: pointer;
  }
  .sizes button.on { background: var(--accent); color: #2a2622; border-color: var(--accent); font-weight: 700; }

  #send {
    width: 100%; margin-top: 24px; padding: 16px; border: 0; border-radius: 14px; background: var(--accent);
    color: #2a2622; font: inherit; font-size: 19px; font-weight: 800; cursor: pointer;
  }
  #send:disabled { opacity: .5; }
  #msg { text-align: center; min-height: 22px; margin-top: 10px; color: var(--dim); font-size: 14px; }
  #msg.ok { color: #6fd28a; }
  #msg.err { color: #ff8a80; }

  #list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px 12px; }
  .item { padding: 22px 10px 10px; min-height: 96px; font-weight: 700; font-size: 15px; text-align: center; cursor: pointer; }
  .item small { display: block; font-weight: 400; font-size: 11px; color: rgba(42,38,34,.6); margin-top: 6px; }
  .item .x {
    position: absolute; top: -8px; left: -8px; width: 28px; height: 28px; border-radius: 50%; border: 0;
    background: #2a2622; color: #fff; font-size: 15px; cursor: pointer; z-index: 1;
  }
  .empty { color: var(--dim); font-size: 14px; text-align: center; grid-column: 1 / -1; padding: 10px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; }
  .ghost { padding: 6px 12px; font-size: 13px; }
  #nochannel { display: none; text-align: center; color: var(--dim); margin-top: 30vh; line-height: 1.8; }
</style>
</head>
<body>
<div id="nochannel">هذا الرابط ناقص.<br>افتح الرابط الخاص بشاشتك.</div>
<main id="app">
  <header>
    <h1>تذكيرات</h1>
    <span id="status"><i></i><span>جاري الاتصال…</span></span>
  </header>

  <div id="note" class="paper">
    <textarea id="text" rows="4" maxlength="240" placeholder="اكتب الملاحظة هنا…" dir="auto"></textarea>
    <span id="count"></span>
  </div>
  <div class="colors" id="colors"></div>

  <h2>المكان في الشاشة</h2>
  <p class="hint">اسحب الورقة لمكانها، أو اضغط أي مكان. واضغط على أي ورقة لتعدّلها.</p>
  <div class="tv">
    <div class="area" id="area">
      <div class="layer" id="layer"></div>
    </div>
  </div>

  <h2>الحجم</h2>
  <div class="sizes" id="sizes"></div>

  <h2>التثبيت</h2>
  <div class="sizes" id="magnets"></div>

  <button id="send">أرسل للشاشة</button>
  <button class="ghost" id="cancel" hidden>إلغاء التعديل، ملاحظة جديدة</button>
  <div id="msg"></div>

  <div class="row">
    <h2>على الشاشة الآن</h2>
    <button class="ghost" id="clear" hidden>امسح الكل</button>
  </div>
  <div id="list"></div>
</main>

<script>
const NTFY = 'https://ntfy.sh/';
const COLORS = ['#FFE36E', '#FFB3C7', '#B8F0A8', '#A8D8FF', '#FFC48A', '#D6C4FF', '#FDFCF7'];
const SIZE_NAMES = ['صغير', 'متوسط', 'كبير', 'كبير جداً'];
const MAGNET_NAMES = ['شريط لاصق', 'قلب أحمر ❤️', 'قلب وردي 🩷'];
// Same as the TV (Overlay.java): width, height, largest text, at 1920 pixels wide.
const SIZES = [[320, 250, 46], [470, 350, 62], [700, 500, 86], [1180, 740, 130]];
// Notes sit at x, y: their top left corner inside the area, at 1920×1080. Older notes have a place (p) instead,
// the same as Overlay.PLACES on the TV.
const M = 56;
const HEART_ROOM = 50;   // the tape or heart hangs over the top edge
// Lengths are written in TV pixels (1920 wide) and turned into widths of the mini TV.
const cq = css => css.replace(/(-?\d+(\.\d+)?)px/g, (_, n) => `${n / 19.2}cqw`);

const channel = location.hash.slice(1).replace(/[^\w-]/g, '');
const $ = id => document.getElementById(id);
const form = { id: null, c: COLORS[0], s: 1, m: 0, x: null, y: null };
let notes = [];
let area = [0, 0, 1920, 1080];
let waitingFor = null;
let drag = null;

if (!channel) {
  $('app').hidden = true;
  $('nochannel').style.display = 'block';
} else {
  start();
}

function start() {
  COLORS.forEach(c => {
    const b = document.createElement('button');
    b.style.background = c;
    b.setAttribute('aria-label', 'لون');
    b.onclick = () => { form.c = c; draw(); };
    $('colors').append(b);
  });
  $('area').onpointerdown = press;
  $('area').onpointermove = move;
  $('area').onpointerup = $('area').onpointercancel = () => { drag = null; };
  $('cancel').onclick = reset;
  SIZE_NAMES.forEach((name, s) => {
    const b = document.createElement('button');
    b.textContent = name;
    b.onclick = () => { form.s = s; draw(); };
    $('sizes').append(b);
  });
  MAGNET_NAMES.forEach((name, m) => {
    const b = document.createElement('button');
    b.textContent = name;
    b.onclick = () => { form.m = m; draw(); };
    $('magnets').append(b);
  });
  $('text').oninput = $('text').onfocus = $('text').onblur = draw;
  $('send').onclick = send;
  $('text').oninput = () => { if (form.x == null) place(); draw(); };
  $('clear').onclick = () => {
    if (confirm('تمسح كل الملاحظات من الشاشة؟')) publish({ op: 'clear' }, 'انمسحت كل الملاحظات');
  };
  draw();
  follow();
}

// The TV publishes the full list of notes to "<channel>-s" whenever it changes, and every few hours.
function follow() {
  const es = new EventSource(NTFY + channel + '-s/sse?since=all');
  es.onmessage = e => {
    try {
      const m = JSON.parse(e.data);
      const state = JSON.parse(m.message);
      notes = state.n || [];
      area = state.a || [0, 0, 1920, 1080];
      setStatus(true);
      if (waitingFor && waitingFor(notes)) {
        waitingFor = null;
        say('وصلت للشاشة ✓', 'ok');
      }
      draw();
    } catch (_) {}
  };
  es.onerror = () => setStatus(false);
}

function setStatus(ok) {
  $('status').className = ok ? 'ok' : '';
  $('status').lastElementChild.textContent = ok ? 'متصل' : 'غير متصل';
}

function draw() {
  $('note').style.backgroundColor = form.c;
  $('note').className = 'paper m' + form.m + ' s' + form.s;
  [...$('magnets').children].forEach((b, i) => b.classList.toggle('on', i === form.m));
  const len = $('text').value.length;
  $('count').textContent = len > 180 ? `${len} / 240` : '';
  [...$('colors').children].forEach((b, i) => b.classList.toggle('on', COLORS[i] === form.c));
  const [l, t, r, b] = area;
  $('area').style.cssText = cq(`left:${l}px;top:${t}px;width:${r - l}px;height:${b - t}px`);
  [...$('sizes').children].forEach((b, i) => b.classList.toggle('on', i === form.s));
  $('send').textContent = form.id ? 'حدّث الملاحظة' : 'أرسل للشاشة';
  $('cancel').hidden = !form.id;

  // Mini TV: the notes on the screen, with the one being written or edited where it will go.
  const layer = $('layer');
  layer.innerHTML = '';
  const shown = notes.filter(n => n.id !== form.id);
  if (form.x != null) shown.push({ id: '_new', t: $('text').value.trim() || '…', c: form.c, s: form.s, m: form.m, x: form.x, y: form.y });
  shown.forEach(n => {
    const { x, y } = pos(n);
    const [w, h, f] = dims(n.s);
    const el = document.createElement('div');
    el.className = 'mini m' + (n.m || 0) + ' s' + n.s + (n.id === '_new' ? ' new' : '');
    el.dataset.id = n.id;
    el.style.cssText = `background-color:${n.c}cc;left:${x / 19.2}cqw;top:${y / 19.2}cqw;` +
      `width:${w / 19.2}cqw;height:${h / 19.2}cqw;font-size:${f / 19.2 * 0.7}cqw`;
    const span = document.createElement('span');
    span.textContent = n.t;
    el.append(span);
    layer.append(el);
  });

  const list = $('list');
  list.innerHTML = '';
  $('clear').hidden = notes.length < 2;
  if (!notes.length) {
    list.innerHTML = '<div class="empty">ما فيه ملاحظات على الشاشة</div>';
  }
  notes.forEach(n => {
    const el = document.createElement('div');
    el.className = 'paper item m' + (n.m || 0) + ' s' + n.s;
    el.style.backgroundColor = n.c;
    el.textContent = n.t;
    const small = document.createElement('small');
    small.textContent = SIZE_NAMES[n.s];
    el.append(small);
    const x = document.createElement('button');
    x.className = 'x';
    x.textContent = '✕';
    x.setAttribute('aria-label', 'احذف');
    x.onclick = e => {
      e.stopPropagation();
      publish({ op: 'del', id: n.id }, 'انحذفت', ns => !ns.some(m => m.id === n.id));
    };
    el.append(x);
    el.onclick = () => edit(n);
    list.append(el);
  });
}

function edit(n, stay) {
  Object.assign(form, { id: n.id, c: n.c, s: n.s, m: n.m || 0 }, pos(n));
  $('text').value = n.t;
  say('تعدّل ملاحظة موجودة: غيّر اللي تبي واضغط «حدّث الملاحظة»');
  draw();
  if (!stay) window.scrollTo({ top: 0, behavior: 'smooth' });
}

function reset() {
  Object.assign(form, { id: null, x: null, y: null });
  $('text').value = '';
  say('');
  draw();
}

function dims(s) {
  const [w, h, f] = SIZES[s] || SIZES[1];
  return [Math.min(w, area[2] - area[0] - 2 * M), h, f];
}

// Where a note is in the area, kept inside it with room for the tape or heart above.
function pos(n) {
  const [w, h] = dims(n.s);
  const aw = area[2] - area[0], ah = area[3] - area[1];
  let x = n.x, y = n.y;
  if (x == null) {
    x = [M, (aw - w) / 2, aw - M - w, aw - M - w, M][n.p] ?? M;
    y = [M, M, M, ah - 170 - h, ah - M - h][n.p] ?? M;
  }
  return {
    x: Math.round(Math.max(8, Math.min(aw - w - 8, x))),
    y: Math.round(Math.max(HEART_ROOM, Math.min(ah - h - 8, y))),
  };
}

// A new note starts in the middle of the area.
function place() {
  const [w, h] = dims(form.s);
  Object.assign(form, pos({ s: form.s, x: (area[2] - area[0] - w) / 2, y: (area[3] - area[1] - h) / 2 }));
}

// Mini TV: tap a note to edit it, drag the note being written or edited, tap an empty spot to move it there.
function press(e) {
  const r = $('area').getBoundingClientRect();
  const k = (area[2] - area[0]) / r.width;   // TV pixels per page pixel
  const hit = e.target.closest('.mini');
  const id = hit && hit.dataset.id;
  if (id && id !== '_new') {
    const n = notes.find(m => m.id === id);
    if (n) edit(n, true);
  } else if (!id) {
    const [w, h] = dims(form.s);
    Object.assign(form, pos({ s: form.s, x: (e.clientX - r.left) * k - w / 2, y: (e.clientY - r.top) * k - h / 2 }));
    draw();
  }
  drag = { k, x0: e.clientX, y0: e.clientY, fx: form.x, fy: form.y };
  $('area').setPointerCapture(e.pointerId);
}

function move(e) {
  if (!drag) return;
  Object.assign(form, pos({ s: form.s, x: drag.fx + (e.clientX - drag.x0) * drag.k, y: drag.fy + (e.clientY - drag.y0) * drag.k }));
  draw();
}

function send() {
  const t = $('text').value.trim();
  if (!t) { say('اكتب الملاحظة أول', 'err'); return; }
  const id = form.id || Math.random().toString(36).slice(2, 10);
  if (form.x == null) place();
  const { x, y } = pos(form);
  publish({ op: 'add', id, t, c: form.c, s: form.s, m: form.m, x, y }, null,
    ns => ns.some(m => m.id === id && m.t === t && m.x === x && m.y === y))
    .then(ok => { if (ok) reset(); });
}

async function publish(cmd, done, arrived) {
  $('send').disabled = true;
  say('يرسل…');
  try {
    const r = await fetch(NTFY + channel, { method: 'POST', body: JSON.stringify(cmd) });
    if (!r.ok) throw new Error(r.status);
    say(done || 'انرسلت، ننتظر الشاشة…');
    waitingFor = arrived || (() => true);
    setTimeout(() => {
      if (waitingFor) { waitingFor = null; say('انرسلت، وتظهر لما تتصل الشاشة بالنت'); }
    }, 15000);
    return true;
  } catch (e) {
    say('ما انرسلت، تأكد من النت وحاول مرة ثانية', 'err');
    return false;
  } finally {
    $('send').disabled = false;
  }
}

function say(s, cls) {
  $('msg').textContent = s;
  $('msg').className = cls || '';
}

function hash(s) {
  let h = 0;
  for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) | 0;
  return Math.abs(h);
}
</script>
</body>
</html>
